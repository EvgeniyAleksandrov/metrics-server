<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Metrics</title>
</head>
<body>

{{range $method, $values := .}}
<h2>Type: {{$method}}</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Value</th>
    </tr>

    {{range $name, $value := $values}}
    <tr>
        <td>{{$name}}</td>
        <td>{{$value}}</td>
    </tr>
    {{end}}

</table>

{{end}}

</body>
</html>
